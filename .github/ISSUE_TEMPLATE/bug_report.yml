name: Bug report
description: Report a reproducible problem in SystemVitals.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, production data, or undisclosed security vulnerabilities."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SystemVitals version or commit
  - type: textarea
    id: environment
    attributes:
      label: Environment and logs
      description: Remove secrets and personal or production data.
