services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: systemvitals
      POSTGRES_PASSWORD: systemvitals
      POSTGRES_DB: systemvitals
    ports:
      - "5432:5432"
    volumes:
      - sv_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U systemvitals"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - sv_redisdata:/data
volumes:
  sv_pgdata:
  sv_redisdata:
