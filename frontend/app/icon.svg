<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="SystemVitals">
  <!-- Favicon rendition of the brand EKG mark. Deliberately simplified vs
       components/brand/logo.tsx: the logo's small pre-spike wiggles mush into a
       medical cross at 16px, so the tab icon keeps only the signature QRS
       peak/trough, with a stroke thick enough to survive downsampling. -->
  <defs>
    <linearGradient id="sv-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17909E"/>
      <stop offset="1" stop-color="#0B6270"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7.5" fill="url(#sv-tile)"/>
  <path d="M3.5 16H11.4L14.1 6.2L17.7 25.8L20.5 16H28.5"
        fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
